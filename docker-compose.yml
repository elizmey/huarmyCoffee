services:
  db:
    image: postgres:16-alpine
    container_name: huarmy-coffee-db
    environment:
      POSTGRES_DB: ${DB_NAME:-huarmy_db}
      POSTGRES_USER: ${DB_USER:-huarmy_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-HuarmyPassword2026}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
